{{ if .Params.suno_url }}
{{ $url := .Params.suno_url }}
{{/* Security: Only allow known Suno domains */}}
{{ if or (hasPrefix $url "https://suno.com/") (hasPrefix $url "https://app.suno.ai/") }}
<div class="suno-player">
  <iframe
    src="{{ $url }}"
    width="100%"
    height="200"
    style="border-radius: 12px; border: none;"
    loading="lazy"
    title="Song Audio Player - {{ .Title }}"
    sandbox="allow-scripts allow-same-origin allow-popups"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>
{{ else }}
<div class="suno-placeholder">
  <div class="placeholder-content">
    <p>Invalid audio source</p>
  </div>
</div>
{{ end }}
{{ else }}
<div class="suno-placeholder">
  <div class="placeholder-content">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <polygon points="10 8 16 12 10 16 10 8"></polygon>
    </svg>
    <p>Audio coming soon</p>
  </div>
</div>
{{ end }}
